        let y;
        if (hasNeg) {
            y = drawV >= 0 ? baseline - barH : baseline;
        } else {
            y = baseline - barH;
        }
        // 负值在 minZero 模式下显示为底部极小条 + 特殊颜色提示
        if (minZero && v < 0) {
            const negH = 3;
            bars += '<rect x="' + x + '" y="' + (baseline - negH) + '" width="' + BAR_W + '" height="' + negH + '" fill="' + fill + '" rx="1.5" opacity="0.5"/>';
        } else {
            bars += '<rect x="' + x + '" y="' + y + '" width="' + BAR_W + '" height="' + barH + '" fill="' + fill + '" rx="1.5" opacity="' + opacity + '"/>';
        }
        if (isForecast) {
            const fY = (minZero && v < 0) ? (baseline - 3) : y;
            const fH = (minZero && v < 0) ? 3 : barH;
            bars += '<rect x="' + x + '" y="' + fY + '" width="' + BAR_W + '" height="' + fH + '" fill="none" stroke="' + fill + '" stroke-width="1.5" stroke-dasharray="3,2" rx="1.5"/>';
        }
    }

    return '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">' + bars + '</svg>';
}

// ─── 提示框内容 ──────────────────────
function tooltipContent(values, metricName) {
    let lines = [];
    for (let i = 0; i < 9; i++) {
        const q = QUARTERS[i];
        const v = values[i];
        const vStr = (v !== null && !isNaN(v)) ? formatYuan(v) : "—";
        const tag = i === 8 ? " (预)" : "";
        lines.push(q + tag + ": " + vStr);
    }
    return metricName + "\n" + lines.join("\n");
}

// ─── 渲染汇总卡片 ────────────────────
function renderSummary() {
    const typeCounts = {};
    STOCK_DATA.forEach(s => {
        const t = s.forecast_type || "其他";
        typeCounts[t] = (typeCounts[t] || 0) + 1;
    });
    const order = ["预增", "略增", "扭亏", "预盈", "续盈", "略减", "预减", "首亏", "续亏", "预亏"];
    const container = document.getElementById("summary-cards");
    let html = "";
    order.forEach(t => {
        if (typeCounts[t]) {
            html += '<div class="summary-card type-' + t + '"><div class="label">' + t + '</div><div class="value">' + typeCounts[t] + '</div></div>';
        }
    });
    // 其他类型
    Object.keys(typeCounts).forEach(t => {
        if (!order.includes(t)) {
            html += '<div class="summary-card"><div class="label">' + t + '</div><div class="value">' + typeCounts[t] + '</div></div>';
        }
    });
    container.innerHTML = html;
}

// ─── 渲染筛选器 ──────────────────────
function renderFilters() {
    const types = [...new Set(STOCK_DATA.map(s => s.forecast_type))].sort();

    const typeSel = document.getElementById("filter-type");
    types.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t;
        opt.textContent = t;
        typeSel.appendChild(opt);
    });

    typeSel.addEventListener("change", renderTable);
    document.getElementById("filter-search").addEventListener("input", renderTable);
}

// ─── 表头 ────────────────────────────
function renderHeader() {
    const groups = [
        { label: "基本信息", cls: "grp-info", span: 5 },
        { label: "营业收入", cls: "grp-revenue", span: 3 },
        { label: "扣非净利润", cls: "grp-deducted", span: 3 },
        { label: "归母净利润", cls: "grp-net", span: 3 },
    ];
    const cols = [
        { key: "code", label: "代码", sortable: true, colCls: "col-info", first: false },
        { key: "name", label: "名称", sortable: true, colCls: "col-info", first: false },
        { key: "industry", label: "行业", sortable: true, colCls: "col-info", first: false },
        { key: "forecast_date", label: "预告日期", sortable: true, colCls: "col-info", first: false },
        { key: "forecast_type", label: "类型", sortable: true, colCls: "col-info", first: false },
        { key: "revenue_spark", label: "走势(9Q)", sortable: false, colCls: "col-revenue", first: true },
        { key: "revenue_yoy", label: "同比", sortable: true, colCls: "col-revenue", first: false },
        { key: "revenue_qoq", label: "环比", sortable: true, colCls: "col-revenue", first: false },
        { key: "deducted_spark", label: "走势(9Q)", sortable: false, colCls: "col-deducted", first: true },
        { key: "deducted_profit_yoy", label: "同比", sortable: true, colCls: "col-deducted", first: false },
        { key: "deducted_profit_qoq", label: "环比", sortable: true, colCls: "col-deducted", first: false },
        { key: "net_profit_spark", label: "走势(9Q)", sortable: false, colCls: "col-net", first: true },
        { key: "net_profit_yoy", label: "同比", sortable: true, colCls: "col-net", first: false },
        { key: "net_profit_qoq", label: "环比", sortable: true, colCls: "col-net", first: false },
    ];

    // 分组行
    const groupRow = document.getElementById("table-header-group");
    let gHtml = "";
    groups.forEach(g => {
        gHtml += '<th class="' + g.cls + '" colspan="' + g.span + '">' + g.label + '</th>';
    });
    groupRow.innerHTML = gHtml;

    // 列标题行
    const headerRow = document.getElementById("table-header");
    let html = "";
    cols.forEach(col => {
        const firstCls = col.first ? " col-group-first" : "";
        const sortedClass = sortCol === col.key ? " sorted" : "";
        const arrow = sortCol === col.key ? (sortAsc ? "&#9650;" : "&#9660;") : "&#9650;";
        if (col.sortable) {
            html += '<th class="' + col.colCls + firstCls + sortedClass + '" onclick="doSort(\'' + col.key + '\')">' +
                    col.label + '<span class="sort-arrow">' + arrow + '</span></th>';
        } else {
            html += '<th class="' + col.colCls + firstCls + '">' + col.label + '</th>';
        }
    });
    headerRow.innerHTML = html;
}

// ─── 排序 ────────────────────────────
window.doSort = function(key) {
    if (sortCol === key) {
        sortAsc = !sortAsc;
    } else {
        sortCol = key;
        sortAsc = true;
    }
    renderHeader();
    renderTable();
};

// ─── 渲染表格 ────────────────────────
function renderTable() {
    const typeFilter = document.getElementById("filter-type").value;
    const searchText = document.getElementById("filter-search").value.trim().toLowerCase();

    let filtered = STOCK_DATA.filter(s => {
        if (typeFilter && s.forecast_type !== typeFilter) return false;
        if (searchText && !s.name.toLowerCase().includes(searchText) && !s.code.includes(searchText)) return false;
        return true;
    });

    // 排序
    if (sortCol) {
        filtered.sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            if (va === null || va === undefined) return 1;
            if (vb === null || vb === undefined) return -1;
            if (typeof va === "string") {
                return sortAsc ? va.localeCompare(vb, "zh") : vb.localeCompare(va, "zh");
            }
            return sortAsc ? (va - vb) : (vb - va);
        });
    }

    document.getElementById("shown-count").textContent = filtered.length;

    const tbody = document.getElementById("table-body");
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="14" class="no-data">未找到匹配的数据</td></tr>';
        return;
    }

    let html = "";
    filtered.forEach(s => {
        html += "<tr>";
        // 代码
        html += '<td><span class="stock-code">' + s.code + '</span></td>';
        // 名称
        html += '<td class="stock-name">' + s.name + '</td>';
        // 行业
        html += '<td><span class="industry-tag">' + s.industry + '</span></td>';
        // 预告日期
        html += '<td>' + s.forecast_date + '</td>';
        // 类型
        html += '<td><span class="forecast-type ft-' + s.forecast_type + '">' + s.forecast_type + '</span></td>';

        // 营收走势
        html += '<td class="sparkline-cell"><div class="sparkline-wrapper">' +
                renderSparkline(s.revenue, "营收", false) +
                '<div class="sparkline-tooltip">' + tooltipContent(s.revenue, "营收") + '</div></div></td>';
        // 营收同比/环比
        html += '<td class="growth-cell">' + formatGrowth(s.revenue_yoy) + '</td>';
        html += '<td class="growth-cell">' + formatGrowth(s.revenue_qoq) + '</td>';

        // 扣非走势
        html += '<td class="sparkline-cell"><div class="sparkline-wrapper">' +
                renderSparkline(s.deducted_profit, "扣非净利润", true) +
                '<div class="sparkline-tooltip">' + tooltipContent(s.deducted_profit, "扣非净利润") + '</div></div></td>';
        // 扣非同比/环比
        html += '<td class="growth-cell">' + formatGrowth(s.deducted_profit_yoy) + '</td>';
        html += '<td class="growth-cell">' + formatGrowth(s.deducted_profit_qoq) + '</td>';

        // 归母走势
        html += '<td class="sparkline-cell"><div class="sparkline-wrapper">' +
                renderSparkline(s.net_profit, "归母净利润", true) +
                '<div class="sparkline-tooltip">' + tooltipContent(s.net_profit, "归母净利润") + '</div></div></td>';
        // 归母同比/环比
        html += '<td class="growth-cell">' + formatGrowth(s.net_profit_yoy) + '</td>';
        html += '<td class="growth-cell">' + formatGrowth(s.net_profit_qoq) + '</td>';

        html += "</tr>";
    });
    tbody.innerHTML = html;
}

// ─── 初始化 ──────────────────────────
renderSummary();
renderFilters();
renderHeader();
renderTable();
</script>
</body>
