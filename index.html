// ─── 工具函数 ────────────────────────
function formatYuan(val) {
    if (val === null || val === undefined || isNaN(val)) return "—";
    const abs = Math.abs(val);
    const sign = val < 0 ? "-" : "";
    if (abs >= 1e8) return sign + (abs / 1e8).toFixed(2) + "亿";
    if (abs >= 1e4) return sign + (abs / 1e4).toFixed(2) + "万";
    return sign + val.toFixed(2) + "元";
}

function formatGrowth(val) {
    if (val === null || val === undefined) return '<span class="growth-na">—</span>';
    const cls = val > 0 ? "growth-positive" : val < 0 ? "growth-negative" : "growth-na";
    const sign = val > 0 ? "+" : "";
    return '<span class="' + cls + '">' + sign + val.toFixed(1) + '%</span>';
}

// ─── 迷你柱状图 SVG ─────────────────
function renderSparkline(values, metricName, minZero) {
    const W = 180, H = 50, BAR_W = 15, GAP = 5;
    const PADDING_LEFT = 2;

    const validVals = values.filter(v => v !== null && !isNaN(v));
    if (validVals.length === 0) {
        return '<svg width="' + W + '" height="' + H + '"><text x="' + (W/2) + '" y="' + (H/2) +
               '" text-anchor="middle" fill="#cbd5e1" font-size="12">N/A</text></svg>';
    }

    // minZero=true 时，将负值视为 0 进行绘制（垂直轴最小值=0）
    const displayVals = minZero ? validVals.map(v => Math.max(v, 0)) : validVals;
    const maxAbs = minZero
        ? Math.max(...displayVals)
        : Math.max(...validVals.map(Math.abs));
    if (maxAbs === 0) {
        return '<svg width="' + W + '" height="' + H + '"><line x1="0" y1="' + (H-2) +
               '" x2="' + W + '" y2="' + (H-2) + '" stroke="#e5e7eb" stroke-width="0.5"/></svg>';
    }

    const hasNeg = minZero ? false : validVals.some(v => v < 0);
    const baseline = hasNeg ? H / 2 : H - 2;
    const maxBarH = hasNeg ? (H / 2 - 3) : (H - 6);

    let bars = '';
    // baseline
    if (hasNeg) {
        bars += '<line x1="0" y1="' + baseline + '" x2="' + W + '" y2="' + baseline + '" stroke="#e5e7eb" stroke-width="0.5"/>';
    }

    for (let i = 0; i < 9; i++) {
        const x = PADDING_LEFT + i * (BAR_W + GAP);
        const v = values[i];
        if (v === null || isNaN(v)) {
            // 灰色占位
            bars += '<line x1="' + x + '" y1="' + baseline + '" x2="' + (x + BAR_W) + '" y2="' + baseline + '" stroke="#ddd" stroke-width="2" stroke-dasharray="3,2"/>';
            continue;
        }
        const drawV = minZero ? Math.max(v, 0) : v;
        const barH = Math.max((Math.abs(drawV) / maxAbs) * maxBarH, minZero && v < 0 ? 2 : 2);
        const isForecast = (i === 8);
        let fill;
        if (isForecast) {
            fill = v >= 0 ? "#3b82f6" : "#f97316";
        } else {
            fill = v >= 0 ? "#dc2626" : "#16a34a";
        }
        const opacity = isForecast ? "0.9" : "0.7";
        let y;
        if (hasNeg) {
            y = drawV >= 0 ? baseline - barH : baseline;
        } else {
            y = baseline - barH;
        }
        // 负值在 minZero 模式下显示为底部极小条 + 特殊颜色提示
        if (minZero && v < 0) {
            const negH = 3;
            bars += '<rect x="' + x + '" y="' + (baseline - negH) + '" width="' + BAR_W + '" height="' + negH + '" fill="' + fill + '" rx="1.5" opacity="0.5"/>';
        } else {
            bars += '<rect x="' + x + '" y="' + y + '" width="' + BAR_W + '" height="' + barH + '" fill="' + fill + '" rx="1.5" opacity="' + opacity + '"/>';
        }
        if (isForecast) {
            const fY = (minZero && v < 0) ? (baseline - 3) : y;
            const fH = (minZero && v < 0) ? 3 : barH;
            bars += '<rect x="' + x + '" y="' + fY + '" width="' + BAR_W + '" height="' + fH + '" fill="none" stroke="' + fill + '" stroke-width="1.5" stroke-dasharray="3,2" rx="1.5"/>';
        }
    }

    return '<svg width="' + W + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg">' + bars + '</svg>';
}

function tooltipContent(values, metricName) {
    let lines = [];
    for (let i = 0; i < 9; i++) {
        const q = QUARTERS[i];
        const v = values[i];
        const vStr = (v !== null && !isNaN(v)) ? formatYuan(v) : "—";

        lines.push(q + tag + ": " + vStr);
    }
    return metricName + "\n" + lines.join("\n");
}

function selectAllDates() {
    selectedDates.clear();
    document.querySelectorAll("#date-filter-options input[type=checkbox]").forEach(cb => cb.checked = false);
    updateDateDisplay();
    renderTable();

function clearAllDates() {
    const allDates = [...new Set(STOCK_DATA.map(s => s.forecast_date))];
    selectedDates = new Set(allDates);
    document.querySelectorAll("#date-filter-options input[type=checkbox]").forEach(cb => cb.checked = true);
    updateDateDisplay();
    renderTable();
}

function onDateCheckChange(date, checked) {
    const allDates = [...new Set(STOCK_DATA.map(s => s.forecast_date))].sort().reverse();
    if (checked) {
        selectedDates.add(date);
    } else {
        selectedDates.delete(date);
    }
    // 如果选中了全部，等同于"全部"
    if (selectedDates.size === allDates.length || selectedDates.size === 0) {
        selectedDates.clear();
        document.querySelectorAll("#date-filter-options input[type=checkbox]").forEach(cb => cb.checked = false);
    }
    updateDateDisplay();
    renderTable();
}

function updateDateDisplay() {
    const display = document.getElementById("date-filter-display");
    if (selectedDates.size === 0) {
        display.innerHTML = '全部日期 <span style="font-size:10px;">&#9660;</span>';
    } else if (selectedDates.size === 1) {
        display.innerHTML = [...selectedDates][0] + ' <span style="font-size:10px;">&#9660;</span>';
    } else {
        display.innerHTML = selectedDates.size + '个日期 <span style="font-size:10px;">&#9660;</span>';
    }
}

function exportToTHS() {
    // 获取当前筛选后的股票列表
    const typeFilter = document.getElementById("filter-type").value;
    const searchText = document.getElementById("filter-search").value.trim().toLowerCase();

    let filtered = STOCK_DATA.filter(s => {
        if (typeFilter && s.forecast_type !== typeFilter) return false;
        if (selectedDates.size > 0 && !selectedDates.has(s.forecast_date)) return false;
        if (searchText && !s.name.toLowerCase().includes(searchText) && !s.code.includes(searchText)) return false;
        return true;
    });

    if (filtered.length === 0) {
        alert("当前筛选结果为空，无法导出");
        return;
    }

    const codes = filtered.map(s => s.code).join(",") + ",";
    const content = "[block]\nstocks=" + codes + "\n";

    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "forecast.ini";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

        { key: "code", label: "代码", sortable: true, colCls: "col-info", first: false },
        { key: "name", label: "名称", sortable: true, colCls: "col-info", first: false },
        { key: "industry", label: "行业", sortable: true, colCls: "col-info", first: false },
        { key: "forecast_date", label: "预告日期", sortable: true, colCls: "col-info", first: false },
        { key: "forecast_type", label: "类型", sortable: true, colCls: "col-info", first: false },
        { key: "revenue_spark", label: "走势(9Q)", sortable: false, colCls: "col-revenue", first: true },
        { key: "revenue_yoy", label: "同比", sortable: true, colCls: "col-revenue", first: false },
        { key: "revenue_qoq", label: "环比", sortable: true, colCls: "col-revenue", first: false },
        { key: "deducted_spark", label: "走势(9Q)", sortable: false, colCls: "col-deducted", first: true },
        { key: "deducted_profit_yoy", label: "同比", sortable: true, colCls: "col-deducted", first: false },
        { key: "deducted_profit_qoq", label: "环比", sortable: true, colCls: "col-deducted", first: false },
        { key: "net_profit_spark", label: "走势(9Q)", sortable: false, colCls: "col-net", first: true },
        { key: "net_profit_yoy", label: "同比", sortable: true, colCls: "col-net", first: false },
        { key: "net_profit_qoq", label: "环比", sortable: true, colCls: "col-net", first: false },
    ];

    // 分组行
    const groupRow = document.getElementById("table-header-group");
    let gHtml = "";
    groups.forEach(g => {
        gHtml += '<th class="' + g.cls + '" colspan="' + g.span + '">' + g.label + '</th>';
    });
    groupRow.innerHTML = gHtml;

    // 列标题行
    const headerRow = document.getElementById("table-header");
    let html = "";
    cols.forEach(col => {
        const firstCls = col.first ? " col-group-first" : "";
        const sortedClass = sortCol === col.key ? " sorted" : "";
        const arrow = sortCol === col.key ? (sortAsc ? "&#9650;" : "&#9660;") : "&#9650;";
        if (col.sortable) {
            html += '<th class="' + col.colCls + firstCls + sortedClass + '" onclick="doSort(\'' + col.key + '\')">' +
                    col.label + '<span class="sort-arrow">' + arrow + '</span></th>';
        } else {
            html += '<th class="' + col.colCls + firstCls + '">' + col.label + '</th>';
        }
    });
    headerRow.innerHTML = html;
}

// ─── 排序 ────────────────────────────
window.doSort = function(key) {
    if (sortCol === key) {
        sortAsc = !sortAsc;
    } else {
        sortCol = key;
        sortAsc = true;
    }
    renderHeader();
    renderTable();
};

// ─── 渲染表格 ────────────────────────
function renderTable() {
    const typeFilter = document.getElementById("filter-type").value;
    const searchText = document.getElementById("filter-search").value.trim().toLowerCase();

    let filtered = STOCK_DATA.filter(s => {
        if (typeFilter && s.forecast_type !== typeFilter) return false;
        if (selectedDates.size > 0 && !selectedDates.has(s.forecast_date)) return false;
        if (searchText && !s.name.toLowerCase().includes(searchText) && !s.code.includes(searchText)) return false;
        return true;
    });

    // 排序
    if (sortCol) {
        filtered.sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            if (va === null || va === undefined) return 1;
            if (vb === null || vb === undefined) return -1;
            if (typeof va === "string") {
                return sortAsc ? va.localeCompare(vb, "zh") : vb.localeCompare(va, "zh");
            }
            return sortAsc ? (va - vb) : (vb - va);
        });
    }

    document.getElementById("shown-count").textContent = filtered.length;

    const tbody = document.getElementById("table-body");
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="14" class="no-data">未找到匹配的数据</td></tr>';
        return;
    }

    let html = "";
    filtered.forEach(s => {
        html += "<tr>";
        // 代码
        html += '<td><span class="stock-code">' + s.code + '</span></td>';
        // 名称
        html += '<td class="stock-name">' + s.name + '</td>';
        // 行业
        html += '<td><span class="industry-tag">' + s.industry + '</span></td>';
        // 预告日期
        html += '<td>' + s.forecast_date + '</td>';
        // 类型
        html += '<td><span class="forecast-type ft-' + s.forecast_type + '">' + s.forecast_type + '</span></td>';

        // 营收走势
        html += '<td class="sparkline-cell"><div class="sparkline-wrapper">' +
                renderSparkline(s.revenue, "营收", false) +
                '<div class="sparkline-tooltip">' + tooltipContent(s.revenue, "营收") + '</div></div></td>';
        // 营收同比/环比
        html += '<td class="growth-cell">' + formatGrowth(s.revenue_yoy) + '</td>';
        html += '<td class="growth-cell">' + formatGrowth(s.revenue_qoq) + '</td>';

        // 扣非走势
        html += '<td class="sparkline-cell"><div class="sparkline-wrapper">' +
                renderSparkline(s.deducted_profit, "扣非净利润", true) +
                '<div class="sparkline-tooltip">' + tooltipContent(s.deducted_profit, "扣非净利润") + '</div></div></td>';
        // 扣非同比/环比
        html += '<td class="growth-cell">' + formatGrowth(s.deducted_profit_yoy) + '</td>';
        html += '<td class="growth-cell">' + formatGrowth(s.deducted_profit_qoq) + '</td>';

        // 归母走势
        html += '<td class="sparkline-cell"><div class="sparkline-wrapper">' +
                renderSparkline(s.net_profit, "归母净利润", true) +
                '<div class="sparkline-tooltip">' + tooltipContent(s.net_profit, "归母净利润") + '</div></div></td>';
        // 归母同比/环比
        html += '<td class="growth-cell">' + formatGrowth(s.net_profit_yoy) + '</td>';
        html += '<td class="growth-cell">' + formatGrowth(s.net_profit_qoq) + '</td>';

        html += "</tr>";
    });
    tbody.innerHTML = html;
}

// ─── 初始化 ──────────────────────────
renderSummary();
renderFilters();
renderHeader();
renderTable();
</script>
